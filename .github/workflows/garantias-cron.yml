name: Revisar garantias por vencer

on:
  schedule:
    # 12:00 UTC = 09:00 en Uruguay.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  revisar-garantias:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar cron del backend
        env:
          SIGMA_BACKEND_URL: ${{ vars.SIGMA_BACKEND_URL || 'https://sigma-83pz.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          url="${SIGMA_BACKEND_URL%/}/cron/garantias"

          if [ -n "${CRON_SECRET}" ]; then
            curl --fail --show-error --silent --retry 3 --retry-delay 10 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url"
          else
            curl --fail --show-error --silent --retry 3 --retry-delay 10 "$url"
          fi
